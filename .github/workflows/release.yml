name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CI passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${GITHUB_SHA}"
          STATUS=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions" and .name == "CI / check")] | .[0].conclusion')
          if [ "$STATUS" != "success" ]; then
            echo "CI has not passed for commit ${SHA} (conclusion: ${STATUS}). Aborting release."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - run: cargo build --release --target wasm32-wasip2
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version' extension.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG="v${VERSION}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Pascal extension release." \
            target/wasm32-wasip2/release/pascal.wasm
